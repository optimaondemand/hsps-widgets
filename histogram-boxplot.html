<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Histogram and Box Plot — Same Data, Two Views</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', Arial, sans-serif; background: #EEF1F8; color: #1a2340; padding: 8px; }
  h1 { text-align: center; color: #0E1C42; font-size: 1.3rem; margin-bottom: 2px; }
  .subtitle { text-align: center; color: #6b7a99; font-size: 0.82rem; margin-bottom: 10px; }
  .wrap { max-width: 740px; margin: 0 auto; }
  .panel { background: #fff; border: 2px solid #D0D9E8; border-radius: 12px; padding: 8px 12px; margin-bottom: 8px; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 5px; }
  .row:last-child { margin-bottom: 0; }
  .lab { font-size: 0.72rem; font-weight: 700; color: #C7922C; text-transform: uppercase; letter-spacing: 0.05em; margin-right: 2px; }
  button { font-family: inherit; }
  .btn { padding: 5px 10px; border: 2px solid #0E1C42; border-radius: 8px; background: #fff; color: #0E1C42; font-size: 0.78rem; font-weight: 700; cursor: pointer; }
  .btn:hover { background: #F8FAFD; }
  .btn[aria-pressed="true"] { background: #0E1C42; color: #fff; }
  .btn.reset { border-color: #C0392B; color: #C0392B; margin-left: auto; }
  .btn.reset:hover { background: #fdf0ee; }
  .seg { display: flex; border: 2px solid #0E1C42; border-radius: 8px; overflow: hidden; }
  .seg .btn { border: none; border-radius: 0; }
  .seg .btn + .btn { border-left: 2px solid #0E1C42; }
  button:focus-visible, input:focus-visible { outline: 3px solid #55C8E8; outline-offset: 2px; }
  .pair { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; background: #FDF3E3; border: 1px solid #C7922C; border-radius: 8px; padding: 3px 8px; }
  .pair .lab { color: #8a5f12; }
  .own { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; width: 100%; }
  .own input[type=text] { flex: 1; min-width: 160px; padding: 5px 8px; border: 2px solid #D0D9E8; border-radius: 8px; font-size: 0.8rem; font-family: inherit; }
  .err { color: #C0392B; font-size: 0.76rem; font-weight: 700; width: 100%; min-height: 0; }
  .chk { display: flex; align-items: center; gap: 6px; font-size: 0.8rem; font-weight: 700; color: #0E1C42; cursor: pointer; }
  .chk input { width: 18px; height: 18px; }
  .sliders { display: flex; flex-wrap: wrap; gap: 6px 16px; }
  .sl { flex: 1 1 220px; min-width: 0; }
  .sl label { font-size: 0.78rem; font-weight: 700; color: #0E1C42; display: flex; justify-content: space-between; }
  .sl input[type=range] { width: 100%; accent-color: #0E1C42; }
  .ctx { font-size: 0.78rem; color: #6b7a99; margin-bottom: 4px; }
  .ctx strong { color: #0E1C42; }
  #chartHost { width: 100%; }
  svg { display: block; width: 100%; height: auto; overflow: hidden; }
  svg text { font-family: 'Segoe UI', Arial, sans-serif; fill: #1a2340; }
  .small { font-size: 0.74rem; color: #6b7a99; line-height: 1.45; }
  .sel { font-size: 0.8rem; min-height: 2.8em; margin-top: 2px; color: #1a2340; line-height: 1.4; }
  .sel strong { color: #0E1C42; }
  rect.hit { fill: transparent; cursor: pointer; }
  rect.hit:focus { outline: none; stroke: #0E1C42; stroke-width: 2.5; fill: rgba(14,28,66,0.07); }
  .grid { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 6px; }
  .cell { flex: 1 1 54px; background: #EEF1F8; border-radius: 8px; padding: 3px 2px; text-align: center; min-width: 54px; }
  .cell .k { font-size: 0.6rem; white-space: nowrap; text-transform: uppercase; letter-spacing: 0.04em; color: #6b7a99; }
  .cell .v { font-size: 0.95rem; font-weight: 900; color: #0E1C42; }
  .cell.q { background: #E8F6FB; }
  .shape { background: #EEF1F8; border-left: 5px solid #0E1C42; border-radius: 8px; padding: 5px 10px; font-size: 0.84rem; line-height: 1.4; margin-bottom: 6px; }
  .note { background: #E8F6FB; border-radius: 8px; padding: 4px 10px; font-size: 0.76rem; line-height: 1.4; margin-bottom: 6px; }
  .hide { background: #FDF3E3; border-left: 5px solid #C7922C; border-radius: 8px; padding: 5px 10px; font-size: 0.78rem; line-height: 1.4; }
  .hide b { color: #8a5f12; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div class="wrap">
<h1>Histogram + Box Plot: Same Data, Two Views</h1>
<p class="subtitle">Every dataset here is a made-up example. Both graphs share one number line.</p>

<div class="panel">
  <div class="row" role="group" aria-label="Choose a dataset" id="presetRow">
    <span class="lab">Data</span>
  </div>
  <div class="row">
    <div class="pair" role="group" aria-label="Same box plot, different shapes" id="pairRow">
      <span class="lab">Same box plot, different shapes</span>
    </div>
    <button class="btn reset" id="resetBtn" aria-label="Reset everything to the starting state">Reset</button>
  </div>
  <div class="row">
    <div class="own">
      <label class="lab" for="ownInput">Your own</label>
      <input type="text" id="ownInput" aria-label="Enter your own numbers, separated by commas or spaces, up to 60 values" placeholder="e.g. 4, 7, 7, 9, 12.5, -3">
      <button class="btn" id="ownBtn" aria-label="Use my numbers">Use my numbers</button>
      <div class="err" id="ownErr" role="alert"></div>
    </div>
  </div>
  <div class="row">
    
    <div class="seg" role="group" aria-label="Quartile method">
      <button class="btn" id="convHalves" aria-pressed="true">Median of each half</button>
      <button class="btn" id="convInc" aria-pressed="false">Spreadsheet QUARTILE.INC</button>
    </div>
    <label class="chk"><input type="checkbox" id="outChk" checked aria-label="Show outliers using the 1.5 times IQR fences"> Show outliers using the 1.5 &times; IQR fences</label>
  </div>
  <div class="sliders">
    <div class="sl"><label for="wSl"><span>Bin width</span><span id="wVal"></span></label><input type="range" id="wSl" aria-label="Bin width"></div>
    <div class="sl"><label for="sSl"><span>Bin start (left edge)</span><span id="sVal"></span></label><input type="range" id="sSl" aria-label="Bin start, the left edge of the first bin"></div>
  </div>
</div>

<div class="panel">
  <div class="ctx" id="ctx"></div>
  <div id="chartHost"></div>
  <div class="small">Each bin is left-closed: [a, b) includes a but not b. A value on an edge goes in the bin that starts there.</div>
  <div class="sel" id="selInfo" aria-live="polite"></div>
</div>

<div class="panel">
  <div class="grid" id="grid"></div>
  <div class="shape" id="shape"></div>
  <div class="note" id="convNote"></div>
  <div class="hide" id="hide"></div>
</div>
</div>

<script>
/*PURE*/
function sortNum(a){return a.slice().sort(function(x,y){return x-y;});}
function medianSorted(s){var n=s.length;if(!n)return NaN;var m=n>>1;return n%2?s[m]:(s[m-1]+s[m])/2;}
function quartilesHalves(s){
  var n=s.length,med=medianSorted(s);
  if(n<2)return{q1:med,med:med,q3:med};
  var h=n>>1;
  return{q1:medianSorted(s.slice(0,h)),med:med,q3:medianSorted(s.slice(n-h))};
}
function percInc(s,p){
  var n=s.length;if(n===1)return s[0];
  var pos=p*(n-1),i=Math.floor(pos+1e-12);
  if(i>=n-1)return s[n-1];
  return s[i]+(pos-i)*(s[i+1]-s[i]);
}
function quartilesInc(s){return{q1:percInc(s,0.25),med:percInc(s,0.5),q3:percInc(s,0.75)};}
function fiveNumber(vals,conv){
  var s=sortNum(vals),n=s.length;
  var q=conv==='inc'?quartilesInc(s):quartilesHalves(s);
  var iqr=q.q3-q.q1,lf=q.q1-1.5*iqr,uf=q.q3+1.5*iqr;
  var eps=1e-9*Math.max(1,Math.abs(lf),Math.abs(uf));
  var inside=[],outliers=[],sum=0;
  for(var i=0;i<n;i++){
    sum+=s[i];
    if(s[i]<lf-eps||s[i]>uf+eps)outliers.push(s[i]);else inside.push(s[i]);
  }
  return{n:n,min:s[0],q1:q.q1,med:q.med,q3:q.q3,max:s[n-1],iqr:iqr,lf:lf,uf:uf,
    loW:inside[0],hiW:inside[inside.length-1],outliers:outliers,mean:sum/n,sorted:s};
}
function binIndex(v,start,width){return Math.floor((v-start)/width+1e-9);}
function rnd(x){return Math.round(x*1e9)/1e9;}
function makeBins(vals,start,width){
  var mx=Math.max.apply(null,vals);
  var nb=Math.max(1,binIndex(mx,start,width)+1);
  var bins=[],i;
  for(i=0;i<nb;i++)bins.push({lo:rnd(start+i*width),hi:rnd(start+(i+1)*width),count:0,vals:[]});
  for(i=0;i<vals.length;i++){
    var k=binIndex(vals[i],start,width);
    if(k>=0&&k<nb){bins[k].count++;bins[k].vals.push(vals[i]);}
  }
  return bins;
}
function niceWidth(x){
  var p=Math.pow(10,Math.floor(Math.log10(x))),m=x/p,c=[1,2,2.5,5,10],i;
  for(i=0;i<c.length;i++)if(m<=c[i]+1e-9)return c[i]*p;
  return 10*p;
}
function peaks(counts){
  var runs=[],i;
  for(i=0;i<counts.length;i++){
    if(runs.length&&runs[runs.length-1].c===counts[i])runs[runs.length-1].e=i;
    else runs.push({c:counts[i],s:i,e:i});
  }
  var out=[];
  for(i=0;i<runs.length;i++){
    var l=i>0?runs[i-1].c:0,r=i<runs.length-1?runs[i+1].c:0;
    if(runs[i].c>0&&runs[i].c>l&&runs[i].c>r)out.push({h:runs[i].c,s:runs[i].s,e:runs[i].e});
  }
  return out;
}
function describeShape(f,counts){
  if(f.n<8)return{label:'too few values to describe a shape',kind:'few'};
  var mean=f.mean,ss=0,i;
  for(i=0;i<f.n;i++)ss+=(f.sorted[i]-mean)*(f.sorted[i]-mean);
  var sd=Math.sqrt(ss/(f.n-1));
  if(sd<1e-12)return{label:'a single spike, because every value is the same',kind:'spike'};
  var pk=peaks(counts),mx=Math.max.apply(null,counts),sig=[];
  for(i=0;i<pk.length;i++)if(pk[i].h>=0.5*mx&&pk[i].h>=3)sig.push(pk[i]);
  if(sig.length>=2&&counts.length>=5){
    for(i=0;i<sig.length-1;i++){
      var a=sig[i],b=sig[i+1],valley=Infinity;
      for(var j=a.e+1;j<b.s;j++)valley=Math.min(valley,counts[j]);
      if(valley<=0.5*Math.min(a.h,b.h))return{label:'bimodal (two clusters)',kind:'bimodal'};
    }
  }
  var sk=(mean-f.med)/sd;
  if(sk>0.15)return{label:'right-skewed (a longer tail on the right)',kind:'right'};
  if(sk<-0.15)return{label:'left-skewed (a longer tail on the left)',kind:'left'};
  return{label:'roughly symmetric with one main hump',kind:'sym'};
}
/*ENDPURE*/

function fmt2(x){var s=parseFloat(Number(x).toFixed(2));return String(s===0?0:s);}
function fmt(x){var s=parseFloat(Number(x).toFixed(4));return String(s===0?0:s);}
function parseNumbers(text){
  var parts=text.split(/[\s,;]+/).filter(function(t){return t.length>0;});
  if(!parts.length)return{error:'Type some numbers first.'};
  var out=[];
  for(var i=0;i<parts.length;i++){
    if(!/^[-+]?(\d+\.?\d*|\.\d+)$/.test(parts[i]))return{error:'"'+parts[i]+'" is not a number. Use digits, a minus sign, and a decimal point only.'};
    out.push(parseFloat(parts[i]));
  }
  if(out.length>60)return{error:'That is '+out.length+' numbers. The limit is 60.'};
  return{values:out};
}

/* ---------- Datasets (all made up) ---------- */
var HIST_HIDE='the exact quartiles. You can only estimate them from the bars, and the bars change when you change the bin width.';
var PRESETS=[
 {id:'sym',label:'Symmetric',ctx:'Made-up example: minutes students took to finish a puzzle.',
  data:[38,41,43,44,45,46,47,47,48,49,49,50,50,50,51,51,51,52,52,53,53,54,55,55,56,57,58,59,61,63,66],
  hist:HIST_HIDE,box:'the shape. It cannot show how many values pile up in the middle or whether there are gaps.'},
 {id:'right',label:'Right-skewed',ctx:'Made-up example: messages students sent in one day.',
  data:[2,3,3,4,4,4,5,5,5,5,6,6,6,7,7,8,8,9,10,11,12,13,15,17,19,22,26,31,38,45],
  hist:HIST_HIDE,box:'where the values bunch up. It shows that the upper whisker is long, but not that most values sit at the low end.'},
 {id:'bi',label:'Bimodal',ctx:'Made-up example: scores in a game with an easy mode and a hard mode.',
  data:[12,14,15,16,17,17,18,19,20,21,22,23,24,48,50,51,52,53,54,54,55,56,57,58,59,60,62,64,66],
  hist:HIST_HIDE,box:'the two clusters. The box plot cannot show that there are two groups with a gap between them.'},
 {id:'out',label:'Has an outlier',ctx:'Made-up example: seconds to finish a short course. One run was very slow.',
  data:[62,64,65,66,67,67,68,69,69,70,70,71,71,72,72,73,73,74,75,75,76,77,78,79,80,81,82,83,84,128],
  hist:'the exact quartiles, and the lone far-away value sits in a bar that is easy to miss when the bins are wide.',
  box:'the shape of the main group. It does show the outlier clearly, but not how the other values are spread.'},
 {id:'pairA',label:'Set A: one hump',pair:true,bin:{start:10,width:5},ctx:'Made-up example, Set A: values on a 0 to 100 scale.',
  data:[12,22,27,31,34,37,39,40,40,42,44,46,47,48,49,49,50,51,51,52,53,54,56,58,60,60,64,68,72,77,82,86,88],
  hist:HIST_HIDE,box:'the shape. This box plot is exactly the same for Set A and Set B, but Set A has one hump and Set B has two clusters.'},
 {id:'pairB',label:'Set B: two clusters',pair:true,bin:{start:10,width:5},ctx:'Made-up example, Set B: values on a 0 to 100 scale.',
  data:[12,28,30,32,34,36,38,40,40,40,41,42,43,43,44,45,50,55,56,57,58,59,60,60,60,60,62,63,64,65,66,68,88],
  hist:HIST_HIDE+' Try a bin width of 10 and watch the two clusters blur together.',
  box:'the two clusters. This box plot is exactly the same for Set A and Set B, but Set B has a gap near the median.'}
];

/* ---------- State ---------- */
var S={};
var NS='http://www.w3.org/2000/svg';
var reduceMotion=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function $(id){return document.getElementById(id);}

var DEFAULT_PRESET='pairA';
function resetState(){
  S.presetId=DEFAULT_PRESET;S.conv='halves';S.outliers=true;
  S.custom=null;
  loadData(presetById(DEFAULT_PRESET).data,presetById(DEFAULT_PRESET).bin);
  S.hov=null;S.foc=null;
}
function presetById(id){for(var i=0;i<PRESETS.length;i++)if(PRESETS[i].id===id)return PRESETS[i];}

function loadData(vals,bin){
  S.vals=vals.slice();
  var s=sortNum(S.vals),dmin=s[0],dmax=s[s.length-1];
  var range=dmax-dmin,R=range>0?range:1;
  S.dmin=dmin;S.dmax=dmax;S.R=R;
  S.step=Math.pow(10,Math.floor(Math.log10(R/100)));
  S.wMin=Math.max(S.step,Math.ceil(R/60/S.step-1e-9)*S.step);
  S.wMax=Math.max(S.wMin+S.step,Math.ceil(R*1.5/S.step-1e-9)*S.step);
  var w,st;
  if(bin){w=bin.width;st=bin.start;}
  else{w=niceWidth(R/7);st=Math.floor(dmin/w+1e-9)*w;}
  S.w=rnd(Math.min(Math.max(w,S.wMin),S.wMax));
  S.start=rnd(st);
  clampStart();
  var lastEdge=S.start+(binIndex(dmax,S.start,S.w)+1)*S.w;
  var lo=Math.min(dmin,S.start),hi=Math.max(dmax,lastEdge);
  var pad=(hi-lo)*0.03;
  S.dom={lo:lo-pad,hi:hi+pad};
  var bins=makeBins(S.vals,S.start,S.w),best=0;
  for(var i=0;i<bins.length;i++)if(bins[i].count>bins[best].count)best=i;
  S.defaultSel=best;S.sel=best;
}
function clampStart(){
  S.sMax=Math.floor(S.dmin/S.step+1e-9)*S.step;
  S.sMin=Math.ceil((S.dmin-S.w)/S.step+1e-9)*S.step;
  if(S.sMin>S.sMax)S.sMin=S.sMax;
  S.start=rnd(Math.min(Math.max(S.start,S.sMin),S.sMax));
}

/* ---------- SVG plumbing ---------- */
function el(name,attrs,parent){
  var e=document.createElementNS(NS,name);
  for(var k in attrs)e.setAttribute(k,attrs[k]);
  if(parent)parent.appendChild(e);
  return e;
}
function txt(parent,x,y,str,attrs){
  var a={x:x,y:y,'font-size':attrs&&attrs.size||11};
  if(attrs){for(var k in attrs)if(k!=='size')a[k]=attrs[k];}
  var t=el('text',a,parent);t.textContent=str;return t;
}
var svg,gBack,gBars,gLabels,gFront,gHits,clipRect,W=700;
var G={L:38,histTop:20,histH:100,boxY:152,boxH:24,axisY:200,stripY:248,H:258};
var barEls=[],cur=[],tgt=[],bins=[],ymax=1,animId=0;

function buildSvg(){
  var host=$('chartHost');
  host.innerHTML='';
  W=Math.max(280,host.clientWidth||700);
  svg=el('svg',{viewBox:'0 0 '+W+' '+G.H,role:'group','aria-label':'Histogram on top, box plot below, sharing one horizontal number line'},host);
  var defs=el('defs',{},svg);
  var cp=el('clipPath',{id:'clipH'},defs);
  clipRect=el('rect',{x:G.L,y:G.histTop-2,width:W-G.L-14,height:G.histH+4},cp);
  gBack=el('g',{},svg);
  gBars=el('g',{'clip-path':'url(#clipH)'},svg);
  gLabels=el('g',{},svg);
  gFront=el('g',{'pointer-events':'none'},svg);
  gHits=el('g',{},svg);
  barEls=[];cur=[];
}
function X(v){return G.L+(v-S.dom.lo)/(S.dom.hi-S.dom.lo)*(W-14-G.L);}
function clear(g){while(g.firstChild)g.removeChild(g.firstChild);}

function niceTicks(lo,hi,target){
  var raw=(hi-lo)/target,p=Math.pow(10,Math.floor(Math.log10(raw))),m=raw/p;
  var step=(m<=1?1:m<=2?2:m<=5?5:10)*p,out=[];
  for(var t=Math.ceil(lo/step-1e-9)*step;t<=hi+1e-9;t+=step)out.push(rnd(t));
  return out;
}

/* ---------- Computation for current view ---------- */
function compute(){
  S.f=fiveNumber(S.vals,S.conv==='inc'?'inc':'halves');
  S.fOther=fiveNumber(S.vals,S.conv==='inc'?'halves':'inc');
  bins=makeBins(S.vals,S.start,S.w);
  var mx=0;for(var i=0;i<bins.length;i++)mx=Math.max(mx,bins[i].count);
  ymax=Math.max(mx,1);
  if(ymax>4){var st=ymax<=10?2:ymax<=25?5:10;ymax=Math.ceil(ymax/st)*st;}
  tgt=bins.map(function(b){return{x0:X(b.lo),x1:X(b.hi),h:b.count/ymax*G.histH};});
  if(S.sel!==null&&S.sel>=bins.length)S.sel=null;
}

/* ---------- Bars (animated) ---------- */
function paintBars(from,to,f){
  for(var i=0;i<barEls.length;i++){
    var a=from[i],b=to[i];
    var x0=a.x0+(b.x0-a.x0)*f,x1=a.x1+(b.x1-a.x1)*f,h=a.h+(b.h-a.h)*f;
    cur[i]={x0:x0,x1:x1,h:h};
    barEls[i].setAttribute('x',x0);
    barEls[i].setAttribute('width',Math.max(0,x1-x0));
    barEls[i].setAttribute('y',G.histTop+G.histH-h);
    barEls[i].setAttribute('height',Math.max(0,h));
  }
}
function drawBars(animate){
  var n=Math.max(cur.length,tgt.length),from=[],to=[],i;
  for(i=0;i<n;i++){
    var c=cur[i],t=tgt[i];
    if(!c)c={x0:t.x0,x1:t.x1,h:0};
    if(!t)t={x0:c.x0,x1:c.x1,h:0};
    from.push({x0:c.x0,x1:c.x1,h:c.h});to.push(t);
    if(!barEls[i])barEls[i]=el('rect',{stroke:'#0E1C42','stroke-width':1.5,'pointer-events':'none'},gBars);
  }
  var token=++animId;
  clear(gLabels);
  function finish(){
    while(barEls.length>tgt.length){gBars.removeChild(barEls.pop());}
    cur=tgt.map(function(t){return{x0:t.x0,x1:t.x1,h:t.h};});
    for(var j=0;j<barEls.length;j++){
      barEls[j].setAttribute('x',tgt[j].x0);barEls[j].setAttribute('width',Math.max(0,tgt[j].x1-tgt[j].x0));
      barEls[j].setAttribute('y',G.histTop+G.histH-tgt[j].h);barEls[j].setAttribute('height',Math.max(0,tgt[j].h));
    }
    drawCountLabels();
  }
  if(!animate||reduceMotion){paintBars(to,to,1);finish();return;}
  var t0=null;
  function frame(ts){
    if(token!==animId)return;
    if(t0===null)t0=ts;
    var p=Math.min(1,(ts-t0)/200),e=p<0.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
    paintBars(from,to,e);
    if(p<1)requestAnimationFrame(frame);else finish();
  }
  paintBars(from,to,0);
  requestAnimationFrame(frame);
}
function drawCountLabels(){
  clear(gLabels);
  for(var i=0;i<bins.length;i++){
    if(!bins[i].count)continue;
    var w=tgt[i].x1-tgt[i].x0;
    if(w<13)continue;
    var cx=(Math.max(tgt[i].x0,G.L)+Math.min(tgt[i].x1,W-14))/2;
    txt(gLabels,cx,G.histTop+G.histH-tgt[i].h-3,bins[i].count,{'text-anchor':'middle',size:10,'font-weight':700});
  }
}
function styleBars(){
  var a=activeIdx();
  for(var i=0;i<barEls.length;i++){
    var on=(i===a);
    barEls[i].setAttribute('fill',on?'#C7922C':'#9DBBDD');
    barEls[i].setAttribute('stroke-width',on?2.5:1.5);
  }
  if(!gHits)return;
  for(var j=0;j<gHits.childNodes.length;j++)gHits.childNodes[j].setAttribute('aria-pressed',S.sel===j?'true':'false');
}
function activeIdx(){
  if(S.hov!==null&&S.hov<bins.length)return S.hov;
  if(S.foc!==null&&S.foc<bins.length)return S.foc;
  return S.sel;
}

/* ---------- Hit targets ---------- */
function binLabel(b){return '['+fmt(b.lo)+', '+fmt(b.hi)+')';}
function drawHits(){
  clear(gHits);
  bins.forEach(function(b,i){
    var x0=Math.max(G.L,tgt[i].x0),x1=Math.min(W-14,tgt[i].x1);
    var r=el('rect',{'class':'hit',x:x0,y:G.histTop,width:Math.max(2,x1-x0),height:G.histH,tabindex:0,role:'button',
      'aria-pressed':S.sel===i?'true':'false',
      'aria-label':'Bin '+(i+1)+' of '+bins.length+', '+binLabel(b)+', '+b.count+(b.count===1?' value':' values')+'. Press Enter to keep it selected.'},gHits);
    r.addEventListener('mouseenter',function(){S.hov=i;updateActive();});
    r.addEventListener('mouseleave',function(){S.hov=null;updateActive();});
    r.addEventListener('focus',function(){S.foc=i;updateActive();});
    r.addEventListener('blur',function(){S.foc=null;updateActive();});
    r.addEventListener('click',function(){S.sel=(S.sel===i)?null:i;updateActive();});
    r.addEventListener('keydown',function(e){
      var k=e.key,to=null;
      if(k==='ArrowRight')to=Math.min(bins.length-1,i+1);
      else if(k==='ArrowLeft')to=Math.max(0,i-1);
      else if(k==='Home')to=0;else if(k==='End')to=bins.length-1;
      else if(k==='Enter'||k===' '){e.preventDefault();S.sel=(S.sel===i)?null:i;updateActive();return;}
      else if(k==='Escape'){S.sel=null;updateActive();return;}
      if(to!==null){e.preventDefault();gHits.childNodes[to].focus();}
    });
  });
}

/* ---------- Back layer: grid, axis, y ticks ---------- */
function drawBack(){
  clear(gBack);
  var R=W-14,i;
  var yt=ymax<=5?1:ymax<=10?2:ymax<=25?5:10;
  for(var c=0;c<=ymax;c+=yt){
    var y=G.histTop+G.histH-c/ymax*G.histH;
    el('line',{x1:G.L,x2:R,y1:y,y2:y,stroke:'#E3E9F3','stroke-width':1},gBack);
    txt(gBack,G.L-5,y+3.5,c,{'text-anchor':'end',size:10,fill:'#6b7a99'});
  }
  txt(gBack,G.L-5,10,'count',{'text-anchor':'end',size:10,fill:'#6b7a99'});
  el('line',{x1:G.L,x2:R,y1:G.histTop+G.histH,y2:G.histTop+G.histH,stroke:'#0E1C42','stroke-width':1},gBack);
  var ticks=niceTicks(S.dom.lo,S.dom.hi,Math.max(3,Math.floor((R-G.L)/70)));
  for(i=0;i<ticks.length;i++){
    var x=X(ticks[i]);
    el('line',{x1:x,x2:x,y1:G.histTop,y2:G.axisY,stroke:'#E3E9F3','stroke-width':1,'stroke-dasharray':'2 3'},gBack);
    el('line',{x1:x,x2:x,y1:G.axisY,y2:G.axisY+5,stroke:'#0E1C42','stroke-width':1.5},gBack);
    txt(gBack,x,G.axisY+17,fmt(ticks[i]),{'text-anchor':'middle',size:11,fill:'#1a2340'});
  }
  el('line',{x1:G.L,x2:R,y1:G.axisY,y2:G.axisY,stroke:'#0E1C42','stroke-width':1.5},gBack);
  txt(gBack,G.L,G.stripY-26,'Values in the selected bin',{size:10,fill:'#6b7a99'});
}

/* ---------- Front layer: fences, box plot, strip ---------- */
function regionOf(v,f){
  if(S.outliers&&(v<f.lf-1e-9||v>f.uf+1e-9))return 'out';
  if(v<f.q1)return 'lw';
  if(v<f.med)return 'lb';
  if(v<=f.q3)return 'rb';
  return 'uw';
}
var REGION_TEXT={lw:'the lower whisker',lb:'the left half of the box (Q1 to median)',rb:'the right half of the box (median to Q3)',uw:'the upper whisker',out:'outlier points'};
function drawFront(){
  clear(gFront);
  var f=S.f,a=activeIdx(),R=W-14;
  var cy=G.boxY+G.boxH/2,y0=G.boxY,y1=G.boxY+G.boxH;
  var lo=S.outliers?f.loW:f.min,hi=S.outliers?f.hiW:f.max;
  var regs={};
  var selVals=(a!==null&&bins[a])?bins[a].vals:[];
  selVals.forEach(function(v){regs[regionOf(v,f)]=true;});
  // fences
  if(S.outliers){
    [[f.lf,'lower fence'],[f.uf,'upper fence']].forEach(function(p){
      if(p[0]<S.dom.lo||p[0]>S.dom.hi)return;
      var x=X(p[0]);
      el('line',{x1:x,x2:x,y1:G.histTop,y2:y1+4,stroke:'#6b7a99','stroke-width':1.2,'stroke-dasharray':'5 4',opacity:0.6},gFront);
      var ax=Math.min(Math.max(x,G.L+34),R-34);
      txt(gFront,ax,G.histTop-6,p[1]+' '+fmt(p[0]),{'text-anchor':'middle',size:10,fill:'#6b7a99'});
    });
  }
  // highlight regions
  var hl='#C7922C';
  if(regs.lw)el('line',{x1:X(lo),x2:X(f.q1),y1:cy,y2:cy,stroke:hl,'stroke-width':10,opacity:0.55,'stroke-linecap':'round'},gFront);
  if(regs.uw)el('line',{x1:X(f.q3),x2:X(hi),y1:cy,y2:cy,stroke:hl,'stroke-width':10,opacity:0.55,'stroke-linecap':'round'},gFront);
  if(regs.lb)el('rect',{x:X(f.q1),y:y0-4,width:Math.max(0,X(f.med)-X(f.q1)),height:G.boxH+8,fill:hl,opacity:0.5},gFront);
  if(regs.rb)el('rect',{x:X(f.med),y:y0-4,width:Math.max(0,X(f.q3)-X(f.med)),height:G.boxH+8,fill:hl,opacity:0.5},gFront);
  // whiskers
  el('line',{x1:X(lo),x2:X(f.q1),y1:cy,y2:cy,stroke:'#0E1C42','stroke-width':2},gFront);
  el('line',{x1:X(f.q3),x2:X(hi),y1:cy,y2:cy,stroke:'#0E1C42','stroke-width':2},gFront);
  [lo,hi].forEach(function(v){el('line',{x1:X(v),x2:X(v),y1:cy-8,y2:cy+8,stroke:'#0E1C42','stroke-width':2},gFront);});
  // box
  el('rect',{x:X(f.q1),y:y0,width:Math.max(1,X(f.q3)-X(f.q1)),height:G.boxH,fill:'none',stroke:'#0E1C42','stroke-width':2},gFront);
  el('line',{x1:X(f.med),x2:X(f.med),y1:y0,y2:y1,stroke:'#0E1C42','stroke-width':4},gFront);
  // outliers
  if(S.outliers){
    var seen={};
    f.outliers.forEach(function(v){
      var k=String(v),d=seen[k]||0;seen[k]=d+1;
      var on=selVals.indexOf(v)>=0;
      el('circle',{cx:X(v),cy:cy,r:on?6.5:4.5,fill:on?hl:'#fff',stroke:'#0E1C42','stroke-width':2},gFront);
      if(f.outliers.length<=4&&d===0)txt(gFront,X(v),y1+16,fmt(v),{'text-anchor':'middle',size:10,'font-weight':700});
    });
  }
  // five-number labels
  var labs=[[lo,(S.outliers&&f.loW!==f.min)?'low whisker':'min',-1],[f.q1,'Q1',1],[f.med,'median',-1],[f.q3,'Q3',1],[hi,(S.outliers&&f.hiW!==f.max)?'high whisker':'max',-1]];
  var rowsY=[y0-12,y1+14,y0-24],placed=[[],[],[]];
  labs.forEach(function(l){
    var str=l[1]+' '+fmt(l[0]),hw=str.length*3.0+3;
    var x=Math.min(Math.max(X(l[0]),G.L+hw),R-hw);
    var order=l[2]<0?[0,2,1]:[1,0,2],row=order[0],k,m;
    for(k=0;k<3;k++){
      var ok=true;
      for(m=0;m<placed[order[k]].length;m++)if(Math.abs(placed[order[k]][m].x-x)<placed[order[k]][m].hw+hw){ok=false;break;}
      if(ok){row=order[k];break;}
    }
    placed[row].push({x:x,hw:hw});
    txt(gFront,x,rowsY[row],str,{'text-anchor':'middle',size:10,'font-weight':700});
  });
  // strip
  var sy=G.stripY;
  el('line',{x1:G.L,x2:R,y1:sy+2,y2:sy+2,stroke:'#D0D9E8','stroke-width':1},gFront);
  if(a!==null&&bins[a]){
    var b=bins[a],xa=Math.max(G.L,X(b.lo)),xb=Math.min(R,X(b.hi));
    el('line',{x1:xa,x2:xb,y1:G.stripY-14,y2:G.stripY-14,stroke:'#C7922C','stroke-width':3},gFront);
    el('line',{x1:xa,x2:xa,y1:G.stripY-18,y2:G.stripY-10,stroke:'#C7922C','stroke-width':3},gFront);
    var cnt={};
    selVals.forEach(function(v){
      var k=String(v),d=cnt[k]||0;cnt[k]=d+1;
      el('circle',{cx:X(v),cy:sy-3-d*8,r:3.6,fill:hl,stroke:'#0E1C42','stroke-width':1.3},gFront);
    });
  }
}

/* ---------- Text panels ---------- */
function updateSelText(){
  var a=activeIdx(),f=S.f,box=$('selInfo');
  if(a===null||!bins[a]){
    box.textContent='Hover, tap, or focus a bar to see its values under the box plot. Use the left and right arrow keys to move between bars. Press Enter to keep one selected.';
    return;
  }
  var b=bins[a];
  var s='<strong>Bin '+binLabel(b)+'</strong> has '+b.count+(b.count===1?' value':' values');
  if(b.count){
    var sorted=sortNum(b.vals).map(fmt);
    s+=': '+sorted.join(', ')+'.';
    var order=['lw','lb','rb','uw','out'],found={};
    b.vals.forEach(function(v){found[regionOf(v,f)]=true;});
    var names=order.filter(function(k){return found[k];}).map(function(k){return REGION_TEXT[k];});
    s+=' On the box plot they fall in '+names.join(' and ')+'.';
  }else s+='. Nothing to show on the box plot.';
  box.innerHTML=s;
}
function updateReadout(){
  var f=S.f;
  var items=[['n',f.n],['min',fmt(f.min)],['Q1',fmt(f.q1),1],['median',fmt(f.med),1],['Q3',fmt(f.q3),1],['max',fmt(f.max)],
    ['IQR',fmt(f.iqr)],['low fence',fmt(f.lf)],['high fence',fmt(f.uf)],['outliers',f.outliers.length],['mean',fmt2(f.mean)]];
  $('grid').innerHTML=items.map(function(it){return '<div class="cell'+(it[2]?' q':'')+'"><div class="k">'+it[0]+'</div><div class="v">'+it[1]+'</div></div>';}).join('');
  var sh=describeShape(f,bins.map(function(b){return b.count;}));
  var cmp=Math.abs(f.mean-f.med)<=1e-9*Math.max(1,Math.abs(f.mean))?'about the same as':(f.med<f.mean?'less than':'greater than');
  var sentence='The histogram looks '+sh.label+'.';
  if(sh.kind!=='spike')sentence+=' The median ('+fmt(f.med)+') is '+cmp+' the mean ('+fmt2(f.mean)+').';
  if(f.n<5)sentence+=' With fewer than 5 values, a box plot is not very informative.';
  $('shape').textContent=sentence;
  var o=S.fOther,fa=f,tol=1e-9;
  var same=Math.abs(o.q1-fa.q1)<tol&&Math.abs(o.q3-fa.q3)<tol&&Math.abs(o.med-fa.med)<tol;
  var cn=$('convNote');
  if(same){cn.style.display='none';}
  else{cn.style.display='';
    var nm=S.conv==='inc'?['Median of each half',o]:['QUARTILE.INC',o];
    cn.textContent='The two methods disagree here. '+nm[0]+' gives Q1 = '+fmt(nm[1].q1)+' and Q3 = '+fmt(nm[1].q3)+'. With few values, the halves and the spreadsheet\'s interpolation land in different spots. Neither is wrong. They are different rules.';
  }
  var p=S.custom?null:presetById(S.presetId);
  var hist=p?p.hist:HIST_HIDE,box=p?p.box:'the shape. It cannot show clusters, gaps, or how many values are in each region.';
  $('hide').innerHTML='<b>What does each display hide?</b><br>The histogram hides '+hist+'<br>The box plot hides '+box;
}

/* ---------- Controls ---------- */
function syncSliders(){
  var w=$('wSl'),s=$('sSl');
  w.min=S.wMin;w.max=S.wMax;w.step=S.step;w.value=S.w;
  s.min=S.sMin;s.max=S.sMax;s.step=S.step;s.value=S.start;
  $('wVal').textContent=fmt(S.w);$('sVal').textContent=fmt(S.start);
}
function syncButtons(){
  var ids=PRESETS.map(function(p){return p.id;});
  ids.forEach(function(id){var b=$('p_'+id);if(b)b.setAttribute('aria-pressed',(!S.custom&&S.presetId===id)?'true':'false');});
  $('convHalves').setAttribute('aria-pressed',S.conv==='halves'?'true':'false');
  $('convInc').setAttribute('aria-pressed',S.conv==='inc'?'true':'false');
  $('outChk').checked=S.outliers;
  $('ctx').innerHTML=S.custom?'<strong>Your numbers</strong> (not real data, just what you typed in).':'<strong>'+presetById(S.presetId).ctx+'</strong>';
}
function updateActive(){
  drawFront();styleBars();updateSelText();
}
function fullRender(animate){
  compute();
  drawBack();
  drawBars(animate);
  drawHits();
  styleBars();
  drawFront();
  updateSelText();
  updateReadout();
  syncSliders();
}
function rebuild(){buildSvg();fullRender(false);}

function pickPreset(id){
  var p=presetById(id);
  S.presetId=id;S.custom=null;
  loadData(p.data,p.bin);
  $('ownErr').textContent='';
  syncButtons();rebuild();
}
function init(){
  var pr=$('presetRow'),pair=$('pairRow');
  PRESETS.forEach(function(p){
    var b=document.createElement('button');
    b.className='btn';b.id='p_'+p.id;b.textContent=p.label;b.setAttribute('aria-pressed','false');
    b.setAttribute('aria-label',(p.pair?'Same box plot pair, ':'Dataset: ')+p.label);
    b.addEventListener('click',function(){pickPreset(p.id);});
    (p.pair?pair:pr).appendChild(b);
  });
  $('convHalves').addEventListener('click',function(){S.conv='halves';syncButtons();fullRender(false);});
  $('convInc').addEventListener('click',function(){S.conv='inc';syncButtons();fullRender(false);});
  $('outChk').addEventListener('change',function(){S.outliers=this.checked;fullRender(false);});
  $('wSl').addEventListener('input',function(){
    S.w=rnd(parseFloat(this.value));clampStart();fullRender(true);
  });
  $('sSl').addEventListener('input',function(){
    S.start=rnd(parseFloat(this.value));fullRender(true);
  });
  $('ownBtn').addEventListener('click',useOwn);
  $('ownInput').addEventListener('keydown',function(e){if(e.key==='Enter')useOwn();});
  $('resetBtn').addEventListener('click',function(){
    resetState();$('ownInput').value='';$('ownErr').textContent='';syncButtons();rebuild();
  });
  resetState();syncButtons();rebuild();
  if(window.ResizeObserver){
    var last=$('chartHost').clientWidth;
    new ResizeObserver(function(){var w=$('chartHost').clientWidth;if(w!==last){last=w;rebuild();}}).observe($('chartHost'));
  }else window.addEventListener('resize',rebuild);
}
function useOwn(){
  var r=parseNumbers($('ownInput').value);
  if(r.error){$('ownErr').textContent=r.error;return;}
  $('ownErr').textContent='';
  S.custom=true;
  loadData(r.values,null);
  syncButtons();rebuild();
}
if(typeof document!=='undefined'&&document.getElementById('chartHost'))init();
</script>
</body>
